<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360 Tour Showcase</title>
  
  <!-- Pannellum 360 Viewer CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --border-color: #2a2a2a;
      --text-main: #ffffff;
      --text-muted: #8e8e8e;
      --accent: #0070f3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Clean Navbar with Logo */
    .navbar {
      height: 56px;
      background-color: #080808;
      display: flex;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid var(--border-color);
    }

    .nav-logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-logo {
      height: 32px;
      max-width: 160px;
      object-fit: contain;
    }

    .logo-fallback {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .container {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 24px;
      flex: 1;
    }

    .header {
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      transition: border-color 0.2s, transform 0.2s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      border-color: #444;
      transform: translateY(-2px);
    }

    .thumbnail-wrapper {
      width: 100%;
      height: 160px;
      background-color: #252525;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumbnail-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .no-photos {
      color: var(--text-muted);
      font-size: 13px;
    }

    .card-content {
      padding: 16px;
      background-color: #1a1a1a;
      flex: 1;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .card-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .card-meta {
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* 360 Tour Viewer Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 1000;
      flex-direction: column;
    }

    .modal-header {
      height: 50px;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #080808;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    .modal-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .scene-select {
      background-color: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .modal-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .audio-btn {
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s;
    }

    .audio-btn:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }

    .viewer-relative-container {
      position: relative;
      width: 100%;
      height: calc(100vh - 50px);
      flex: 1;
    }

    #panorama-container {
      width: 100%;
      height: 100%;
    }

    /* Bottom-Left Scene Thumbnails Bar */
    .scene-thumbnails-bar {
      position: absolute;
      bottom: 24px;
      left: 24px;
      display: flex;
      gap: 12px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 12px;
      border-radius: 8px;
      backdrop-filter: blur(8px);
      max-width: 80vw;
      overflow-x: auto;
    }

    .thumb-item {
      width: 110px;
      height: 70px;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: transform 0.2s, border-color 0.2s;
    }

    .thumb-item:hover {
      transform: translateY(-3px);
      border-color: #ffffff;
    }

    .thumb-item.active {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(0, 112, 243, 0.5);
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-item .thumb-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 10px;
      text-align: center;
      padding: 2px 0;
    }
  </style>
</head>
<body>

  <!-- Background Audio Element -->
  <audio id="bg-audio" loop src="bgm.mp3"></audio>

  <!-- Header with Top-Left Logo -->
  <div class="navbar">
    <div class="nav-logo-container">
      <img src="logo.png" alt="Logo" class="nav-logo" onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block';">
      <span id="logo-text" class="logo-fallback" style="display: none;">MY LOGO</span>
    </div>
  </div>

  <!-- Main Homepage Grid -->
  <div class="container">
    <div class="header">
      <h1>Your Projects</h1>
      <p>Pick a project to view 360 degree tours.</p>
    </div>

    <div class="grid" id="project-grid"></div>
  </div>

  <!-- 360 Tour Viewer Modal -->
  <div class="modal" id="viewer-modal">
    <div class="modal-header">
      <div class="modal-left">
        <span class="modal-title" id="modal-project-title">PROJECT 1</span>
        <select id="scene-selector" class="scene-select" onchange="switchScene(parseInt(this.value))"></select>
      </div>
      <div class="modal-right">
        <button class="audio-btn" id="audio-toggle-btn" onclick="toggleAudio()">
          <span id="audio-icon">🎵</span>
          <span id="audio-text">Audio On</span>
        </button>
        <button class="close-btn" onclick="closeViewer()">&times;</button>
      </div>
    </div>

    <div class="viewer-relative-container">
      <div id="panorama-container"></div>
      
      <!-- Bottom Left Scene Thumbnails Overlay -->
      <div class="scene-thumbnails-bar" id="thumbs-bar"></div>
    </div>
  </div>

  <script>
    const totalProjects = 10;
    const maxScenesPerProject = 10;
    const grid = document.getElementById('project-grid');
    const audioEl = document.getElementById('bg-audio');
    
    let projectData = {};
    let currentProjectIndex = null;
    let currentSceneIndex = 0;
    let viewerInstance = null;
    let isAudioPlaying = false;

    // Initialize 10 Projects
    for (let i = 1; i <= totalProjects; i++) {
      projectData[i] = [];
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${i}`;

      card.innerHTML = `
        <div class="thumbnail-wrapper" id="thumb-container-${i}">
          <span class="no-photos">Checking...</span>
        </div>
        <div class="card-content">
          <div class="card-title">PROJECT ${i}</div>
          <div class="card-subtitle" id="sub-${i}">No address yet</div>
          <div class="card-meta" id="meta-${i}">0 scenes</div>
        </div>
      `;

      grid.appendChild(card);
      checkProjectScenes(i);
    }

    // Check scene files (scene-1.jpg up to scene-10.jpg)
    async function checkProjectScenes(projectIndex) {
      const validScenes = [];

      for (let s = 1; s <= maxScenesPerProject; s++) {
        const path = `projects/project-${projectIndex}/scene-${s}.jpg`;
        const exists = await checkImageExists(path);
        if (exists) {
          validScenes.push({
            name: `Scene ${s}`,
            path: path
          });
        }
      }

      projectData[projectIndex] = validScenes;
      updateCardUI(projectIndex, validScenes);
    }

    function checkImageExists(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
      });
    }

    function updateCardUI(index, scenes) {
      const thumbContainer = document.getElementById(`thumb-container-${index}`);
      const meta = document.getElementById(`meta-${index}`);
      const card = document.getElementById(`card-${index}`);

      if (scenes.length > 0) {
        thumbContainer.innerHTML = `<img src="${scenes[0].path}" class="thumbnail-img" alt="Project ${index}">`;
        meta.innerText = `${scenes.length} scene${scenes.length > 1 ? 's' : ''}`;
        card.onclick = () => openViewer(index);
      } else {
        thumbContainer.innerHTML = `<span class="no-photos">No photos yet</span>`;
        meta.innerText = `0 scenes`;
        card.onclick = () => alert(`Add images into "projects/project-${index}/scene-1.jpg" to enable 360 view.`);
      }
    }

    function openViewer(projectIndex) {
      const scenes = projectData[projectIndex];
      if (!scenes || scenes.length === 0) return;

      currentProjectIndex = projectIndex;
      currentSceneIndex = 0;

      document.getElementById('modal-project-title').innerText = `PROJECT ${projectIndex}`;
      
      // Populate Scene Dropdown
      const selector = document.getElementById('scene-selector');
      selector.innerHTML = scenes.map((s, idx) => 
        `<option value="${idx}">Scene ${idx + 1}</option>`
      ).join('');

      // Populate Bottom-Left Thumbnails Bar
      const thumbsBar = document.getElementById('thumbs-bar');
      thumbsBar.innerHTML = scenes.map((s, idx) => `
        <div class="thumb-item ${idx === 0 ? 'active' : ''}" id="thumb-item-${idx}" onclick="switchScene(${idx})">
          <img src="${s.path}" alt="Scene ${idx + 1}">
          <div class="thumb-label">Scene ${idx + 1}</div>
        </div>
      `).join('');

      document.getElementById('viewer-modal').style.display = 'flex';
      load360Panorama(scenes[0].path);

      // Play audio when entering project view
      playAudio();
    }

    function switchScene(sceneIdx) {
      const scenes = projectData[currentProjectIndex];
      if (!scenes || !scenes[sceneIdx]) return;

      currentSceneIndex = sceneIdx;
      document.getElementById('scene-selector').value = sceneIdx;

      // Update thumbnail active states
      document.querySelectorAll('.thumb-item').forEach((el, idx) => {
        if (idx === sceneIdx) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });

      load360Panorama(scenes[sceneIdx].path);
    }

    function load360Panorama(imagePath) {
      if (viewerInstance) {
        viewerInstance.destroy();
      }

      viewerInstance = pannellum.viewer('panorama-container', {
        type: 'equirectangular',
        panorama: imagePath,
        autoLoad: true,
        autoRotate: -2
      });
    }

    function playAudio() {
      audioEl.play().then(() => {
        isAudioPlaying = true;
        updateAudioButtonUI();
      }).catch(err => {
        // Handle browser autoplay restriction silently
        isAudioPlaying = false;
        updateAudioButtonUI();
      });
    }

    function toggleAudio() {
      if (isAudioPlaying) {
        audioEl.pause();
        isAudioPlaying = false;
      } else {
        audioEl.play();
        isAudioPlaying = true;
      }
      updateAudioButtonUI();
    }

    function updateAudioButtonUI() {
      const icon = document.getElementById('audio-icon');
      const text = document.getElementById('audio-text');
      if (isAudioPlaying) {
        icon.innerText = '🎵';
        text.innerText = 'Audio On';
      } else {
        icon.innerText = '🔇';
        text.innerText = 'Audio Off';
      }
    }

    function closeViewer() {
      document.getElementById('viewer-modal').style.display = 'none';
      if (viewerInstance) {
        viewerInstance.destroy();
        viewerInstance = null;
      }
      
      // Stop audio when leaving project page
      audioEl.pause();
      audioEl.currentTime = 0;
      isAudioPlaying = false;
    }
  </script>
</body>
</html>
